import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCgCTF7sndU-q-eFvwiTKz_8C0a3JfZ0H4",
  authDomain:        "ma-collection-69003.firebaseapp.com",
  projectId:         "ma-collection-69003",
  storageBucket:     "ma-collection-69003.firebasestorage.app",
  messagingSenderId: "902502189555",
  appId:             "1:902502189555:web:db73883fe242306da96a86"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

window._auth    = auth;
window._db      = db;
window._signOut = signOut;
window._doc     = doc;
window._setDoc  = setDoc;
window._getDoc  = getDoc;

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  window._uid   = user.uid;
  window._email = user.email || user.displayName || '';
  document.getElementById('hdrEmail').textContent = window._email;
  try {
    const snap = await getDoc(doc(db, 'binders_v2', user.uid));
    if (snap.exists()) {
      const d = snap.data();
      S.binders = d.binders || [];
    }
  } catch(e) { console.warn('Firestore load:', e); }
  if (window._appReady) window._appReady();
});
</script>

<style>
/* ─── TOKENS ──────────────────────────────────── */
:root {
  --bg:      #05080d;
  --s1:      #0c1520;
  --s2:      #111f2e;
  --s3:      #16273a;
  --border:  #1a2e42;
  --border2: #223344;
  --gold:    #f5c400;
  --gold2:   #d4a800;
  --blue:    #3b82f6;
  --green:   #22c55e;
  --red:     #ef4444;
  --purple:  #a855f7;
  --fog:     #4a6278;
  --mist:    #7a96aa;
  --snow:    #dce8f2;
  --r:       10px;
  --shadow:  0 8px 32px rgba(0,0,0,.6);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--snow);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ─── HEADER ──────────────────────────────────── */
.header {
  height: 54px;
  background: linear-gradient(135deg, #0a1220, #0f1c2e);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 2px 16px rgba(0,0,0,.5);
}
.home-link {
  display: flex; align-items: center; gap: 7px;
  text-decoration: none; color: var(--mist);
  font-size: .82rem; font-weight: 700;
  padding: 5px 12px; border-radius: 8px;
  border: 1px solid var(--border);
  transition: all .18s; flex-shrink: 0;
}
.home-link:hover { color: var(--gold); border-color: rgba(245,196,0,.4); background: rgba(245,196,0,.06); }
.header-sep { width: 1px; height: 26px; background: var(--border); }
.header-logo {
  font-size: 1.05rem; font-weight: 800;
  color: var(--snow); letter-spacing: -.3px;
  display: flex; align-items: center; gap: 7px;
}
.header-logo em { color: var(--gold); font-style: normal; }
.header-logo .bolt {
  width: 24px; height: 24px; background: var(--gold);
  clip-path: polygon(60% 0%,100% 40%,65% 45%,100% 100%,35% 55%,70% 50%,30% 0%);
}

/* top nav */
.top-nav { display: flex; gap: 5px; flex: 1; }
.top-nav-btn {
  background: transparent; border: 1px solid transparent;
  color: var(--fog); padding: 6px 14px; border-radius: 8px;
  cursor: pointer; font-size: .84rem; font-weight: 600;
  transition: all .18s; font-family: inherit;
  display: flex; align-items: center; gap: 6px;
}
.top-nav-btn:hover { color: var(--mist); background: var(--s2); }
.top-nav-btn.on { color: var(--gold); background: rgba(245,196,0,.07); border-color: rgba(245,196,0,.22); }
.top-nav-btn.soon {
  opacity: .4; cursor: not-allowed;
  position: relative;
}
.top-nav-btn.soon::after {
  content: 'Bientôt';
  position: absolute; top: -8px; right: -4px;
  font-size: .55rem; background: var(--border2); color: var(--mist);
  padding: 1px 5px; border-radius: 4px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
}

.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.hdr-email { font-size: .74rem; color: var(--fog); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-logout {
  background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2);
  color: #f87171; padding: 5px 11px; border-radius: 7px;
  font-size: .74rem; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: all .15s;
}
.btn-logout:hover { background: rgba(239,68,68,.2); }

/* ─── MAIN ────────────────────────────────────── */
main { max-width: 1200px; margin: 0 auto; padding: 28px 22px; }

/* ─── VIEWS ───────────────────────────────────── */
.view { display: none; }
.view.on { display: block; }

/* ─── PAGE TITLE ──────────────────────────────── */
.page-title {
  font-size: 1.5rem; font-weight: 900;
  color: var(--snow); margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
.page-subtitle { font-size: .88rem; color: var(--mist); margin-bottom: 28px; }

/* ─── STATS BAR ───────────────────────────────── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px; margin-bottom: 32px;
}
.stat-card {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px 20px;
  transition: border-color .18s;
}
.stat-card:hover { border-color: var(--border2); }
.stat-label {
  font-size: .72rem; font-weight: 700; color: var(--fog);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px;
}
.stat-value {
  font-size: 1.8rem; font-weight: 900; color: var(--snow); line-height: 1;
}
.stat-value.gold { color: var(--gold); }
.stat-value.green { color: var(--green); }
.stat-value.purple { color: var(--purple); }

/* ─── SECTION ─────────────────────────────────── */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-size: 1rem; font-weight: 800; color: var(--snow);
  display: flex; align-items: center; gap: 8px;
}
.section-count {
  font-size: .75rem; color: var(--fog);
  background: var(--s2); border: 1px solid var(--border);
  padding: 2px 9px; border-radius: 20px;
}

/* ─── BTN ─────────────────────────────────────── */
.btn {
  background: var(--gold); color: #000; border: none;
  padding: 10px 18px; border-radius: 9px;
  font-weight: 800; font-size: .88rem; cursor: pointer;
  transition: opacity .15s, transform .1s; font-family: inherit;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { opacity: .87; }
.btn:active { transform: scale(.97); }
.btn.ghost {
  background: var(--s2); color: var(--snow);
  border: 1px solid var(--border); font-weight: 600;
}
.btn.ghost:hover { border-color: var(--gold); color: var(--gold); background: rgba(245,196,0,.06); }
.btn.danger { background: var(--red); color: #fff; }
.btn.sm { padding: 7px 13px; font-size: .8rem; }
.btn.xs { padding: 4px 9px; font-size: .72rem; }

/* ─── BINDER GRID ─────────────────────────────── */
.binders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px; margin-bottom: 40px;
}

.binder-card {
  border-radius: 14px; overflow: hidden;
  cursor: pointer; position: relative;
  transition: transform .2s cubic-bezier(.22,.68,0,1.2), box-shadow .2s;
  border: 1px solid rgba(255,255,255,.06);
}
.binder-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,.6); }

.binder-card-top {
  height: 80px; position: relative;
  display: flex; align-items: flex-end; padding: 12px 16px;
}
.binder-card-top::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,.55));
}
.binder-card-icon {
  font-size: 1.6rem; position: relative; z-index: 1;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
}
.binder-card-acts {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  display: flex; gap: 4px; opacity: 0; transition: opacity .18s;
}
.binder-card:hover .binder-card-acts { opacity: 1; }

.binder-card-body {
  background: var(--s1); padding: 14px 16px 16px;
}
.binder-card-name {
  font-size: 1rem; font-weight: 800; color: var(--snow);
  margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.binder-card-meta {
  font-size: .76rem; color: var(--mist); margin-bottom: 10px;
  display: flex; gap: 10px; flex-wrap: wrap;
}
.binder-card-meta span { display: flex; align-items: center; gap: 4px; }

/* set tags in card */
.set-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.set-tag {
  font-size: .68rem; padding: 3px 9px; border-radius: 20px;
  border: 1px solid; font-weight: 600;
  display: flex; align-items: center; gap: 4px;
}
.set-tag.status-done    { background: rgba(34,197,94,.1);  border-color: rgba(34,197,94,.35);  color: #86efac; }
.set-tag.status-master  { background: rgba(168,85,247,.1); border-color: rgba(168,85,247,.35); color: #d8b4fe; }
.set-tag.status-wip     { background: rgba(59,130,246,.1); border-color: rgba(59,130,246,.35); color: #93c5fd; }
.set-tag.status-none    { background: rgba(255,255,255,.04); border-color: var(--border);      color: var(--mist); }
.set-tag.status-trade   { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.35); color: #fcd34d; }
.set-tag.status-wish    { background: rgba(239,68,68,.1);  border-color: rgba(239,68,68,.35);  color: #fca5a5; }

/* progress bar */
.pbar-wrap { display: flex; align-items: center; gap: 8px; }
.pbar { flex: 1; height: 4px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
.pbar-fill { height: 4px; border-radius: 3px; transition: width .5s cubic-bezier(.22,.68,0,1.2); }
.pbar-pct { font-size: .72rem; color: var(--mist); flex-shrink: 0; min-width: 32px; text-align: right; }

/* icon buttons */
.icon-btn {
  background: rgba(0,0,0,.5); border: none; color: #fff;
  width: 28px; height: 28px; border-radius: 7px; cursor: pointer;
  font-size: .8rem; display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.icon-btn:hover { background: rgba(0,0,0,.8); }

/* ─── MODAL ───────────────────────────────────── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.82); z-index: 600;
  align-items: flex-start; justify-content: center;
  overflow-y: auto; padding: 40px 20px;
  backdrop-filter: blur(4px);
}
.overlay.open { display: flex; }

.modal {
  background: var(--s1); border: 1px solid var(--border2);
  border-radius: 16px; padding: 28px;
  width: 100%; max-width: 560px;
  box-shadow: 0 32px 64px rgba(0,0,0,.7);
  animation: modIn .2s cubic-bezier(.22,.68,0,1.2);
  margin: auto;
}
@keyframes modIn { from { opacity:0; transform:scale(.94) translateY(10px); } to { opacity:1; transform:none; } }

.modal-title {
  font-size: 1.15rem; font-weight: 900; margin-bottom: 22px;
  display: flex; align-items: center; gap: 9px;
}

/* form fields */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.field label {
  font-size: .74rem; font-weight: 700; color: var(--mist);
  text-transform: uppercase; letter-spacing: .06em;
}
input[type=text], input[type=number], select, textarea {
  background: var(--s2); border: 1px solid var(--border2);
  color: var(--snow); padding: 11px 14px;
  border-radius: 9px; font-size: .92rem; outline: none;
  width: 100%; font-family: inherit;
  transition: border-color .18s, box-shadow .18s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(245,196,0,.1);
}
input::placeholder, textarea::placeholder { color: var(--fog); }
select option { background: var(--s2); }

/* two col fields */
.fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* color pickers */
.color-pair { display: flex; gap: 12px; align-items: flex-end; }
.color-pick-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.color-pick-group label { font-size: .74rem; font-weight: 700; color: var(--mist); text-transform: uppercase; letter-spacing: .06em; }
.color-pick-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.csw {
  width: 26px; height: 26px; border-radius: 50%;
  cursor: pointer; border: 2.5px solid transparent;
  transition: transform .15s, box-shadow .15s; flex-shrink: 0;
}
.csw:hover { transform: scale(1.2); }
.csw.on { transform: scale(1.2); box-shadow: 0 0 0 2px var(--s1), 0 0 0 4px currentColor; }
.csw.rainbow {
  background: conic-gradient(hsl(0,100%,55%),hsl(60,100%,50%),hsl(120,100%,45%),hsl(180,100%,45%),hsl(240,100%,65%),hsl(300,100%,60%),hsl(0,100%,55%));
  border: 2px solid rgba(255,255,255,.2) !important;
}
.cpwrap { position: relative; width: 26px; height: 26px; }
.cpwrap input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: none; }

/* gradient preview */
.gradient-preview {
  height: 32px; border-radius: 8px; margin-top: 8px;
  border: 1px solid var(--border2);
  transition: background .3s;
}

/* modal actions */
.modal-acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; flex-wrap: wrap; }

/* ─── BINDER DETAIL VIEW ─────────────────────── */
.binder-detail-header {
  border-radius: 16px; overflow: hidden;
  margin-bottom: 24px; position: relative;
}
.binder-detail-bg {
  height: 140px; position: relative;
  display: flex; align-items: flex-end; padding: 20px 24px;
}
.binder-detail-bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 20%, rgba(0,0,0,.65));
}
.binder-detail-info { position: relative; z-index: 1; }
.binder-detail-name {
  font-size: 1.6rem; font-weight: 900; color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,.5); margin-bottom: 4px;
}
.binder-detail-meta { font-size: .82rem; color: rgba(255,255,255,.7); display: flex; gap: 14px; flex-wrap: wrap; }

.binder-detail-body {
  background: var(--s1); border: 1px solid var(--border);
  border-top: none; border-radius: 0 0 16px 16px; padding: 20px;
}
.binder-detail-actions { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }

/* sets list inside binder detail */
.sets-list-header {
  display: grid;
  grid-template-columns: 28px 1fr 120px 130px 110px 40px;
  gap: 10px; padding: 8px 14px;
  font-size: .7rem; font-weight: 700; color: var(--fog);
  text-transform: uppercase; letter-spacing: .06em;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}
.set-row-item {
  display: grid;
  grid-template-columns: 28px 1fr 120px 130px 110px 40px;
  cursor: default;
  gap: 10px; align-items: center;
  padding: 12px 14px; border-radius: 9px;
  transition: background .12s;
  border: 1px solid transparent;
}
.set-row-item:hover { background: var(--s2); border-color: var(--border); }
.drag-handle { color: var(--fog); cursor: grab; font-size: 1rem; display:flex; align-items:center; justify-content:center; user-select:none; }
.drag-handle:active { cursor: grabbing; }
.set-row-item.drag-over { border-color: var(--gold); background: rgba(245,196,0,.06); }

.set-row-name { font-size: .9rem; font-weight: 700; color: var(--snow); }
.set-row-sub { font-size: .72rem; color: var(--mist); margin-top: 2px; }
.set-row-cards { font-size: .84rem; color: var(--mist); }

/* status badge */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .72rem; font-weight: 700; padding: 4px 10px;
  border-radius: 20px; border: 1px solid; white-space: nowrap;
}
.status-badge.s0 { background: rgba(255,255,255,.04); border-color: var(--border); color: var(--mist); }
.status-badge.s1 { background: rgba(59,130,246,.1);  border-color: rgba(59,130,246,.35);  color: #93c5fd; }
.status-badge.s2 { background: rgba(34,197,94,.1);   border-color: rgba(34,197,94,.35);   color: #86efac; }
.status-badge.s3 { background: rgba(168,85,247,.1);  border-color: rgba(168,85,247,.35);  color: #d8b4fe; }
.status-badge.s4 { background: rgba(245,158,11,.1);  border-color: rgba(245,158,11,.35);  color: #fcd34d; }
.status-badge.s5 { background: rgba(239,68,68,.1);   border-color: rgba(239,68,68,.35);   color: #fca5a5; }
.status-badge.s6 { background: rgba(20,184,166,.1);  border-color: rgba(20,184,166,.35);  color: #5eead4; }

/* progress in detail */
.detail-progress {
  display: flex; align-items: center; gap: 10px; margin-top: 16px;
  padding: 12px 14px; background: var(--s2);
  border-radius: 9px; border: 1px solid var(--border);
}
.detail-progress-label { font-size: .78rem; color: var(--mist); flex-shrink: 0; }
.detail-progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; }
.detail-progress-fill { height: 6px; border-radius: 4px; transition: width .6s; }
.detail-progress-pct { font-size: .84rem; font-weight: 800; color: var(--gold); flex-shrink: 0; min-width: 38px; text-align: right; }

/* ─── ADD SET MODAL specific ─────────────────── */
.set-search-results {
  max-height: 220px; overflow-y: auto;
  border: 1px solid var(--border2); border-radius: 9px;
  margin-top: 6px; background: var(--bg);
}
.set-search-item {
  padding: 10px 14px; cursor: pointer;
  transition: background .12s;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.set-search-item:last-child { border-bottom: none; }
.set-search-item:hover { background: var(--s2); }
.ssi-name { font-size: .88rem; font-weight: 600; }
.ssi-id { font-size: .72rem; color: var(--mist); font-family: monospace; }
.ssi-count { font-size: .72rem; color: var(--fog); background: var(--s2); padding: 2px 7px; border-radius: 5px; }

/* ─── EMPTY STATE ─────────────────────────────── */
.empty {
  text-align: center; padding: 56px 24px;
  background: var(--s1); border: 1px dashed var(--border);
  border-radius: 14px;
}
.empty-ico { font-size: 2.8rem; margin-bottom: 14px; }
.empty h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
.empty p { font-size: .88rem; color: var(--mist); margin-bottom: 20px; }

/* ─── TOAST ───────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--s1); border: 1px solid var(--border2);
  border-left: 3px solid var(--gold); color: var(--snow);
  padding: 10px 16px; border-radius: 9px; font-size: .84rem;
  box-shadow: var(--shadow); z-index: 1000;
  transform: translateY(80px); opacity: 0;
  transition: transform .28s cubic-bezier(.22,.68,0,1.2), opacity .22s;
  pointer-events: none; max-width: 280px;
}
.toast.on { transform: translateY(0); opacity: 1; }
.toast.ok  { border-left-color: var(--green); }
.toast.err { border-left-color: var(--red); }

/* ─── LOADING ─────────────────────────────────── */
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 32px; color: var(--mist); }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .65s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── RESPONSIVE ──────────────────────────────── */
@media (max-width: 640px) {
  main { padding: 18px 14px; }
  .fields-row { grid-template-columns: 1fr; }
  .sets-list-header, .set-row-item { grid-template-columns: 1fr auto auto; }
  .sets-list-header > *:nth-child(3),
  .set-row-item > *:nth-child(3) { display: none; }
}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="header">
  <a href="index.html" class="home-link">⚡ Accueil</a>
  <div class="header-sep"></div>
  <div class="header-logo">
    <div class="bolt"></div>

<script>
// ══════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════
const TCG = 'https://api.tcgdex.net/v2';
const SK  = 'bindersv2';

const COLORS = [
  '#1d4ed8','#7c3aed','#be185d','#b91c1c',
  '#b45309','#15803d','#0369a1','#374151',
  '#0e7490','#9333ea','#c2410c','#065f46',
];

const STATUS = [
  { label:'📦 Non commencé',          cls:'s0' },
  { label:'🔵 En cours',              cls:'s1' },
  { label:'✅ Full Set',              cls:'s2' },
  { label:'💎 Master Set',            cls:'s3' },
  { label:'⭐ Complété (sans secrètes)', cls:'s4' },
  { label:'🔴 Liste de souhaits',     cls:'s5' },
  { label:'🔄 En échange / Recherche',cls:'s6' },
];

// % de complétion implicite par statut (pour le calcul global)
const STATUS_PCT = [0, 50, 100, 100, 90, 0, 25];

const FORMATS = [
  'A4 2×4','A4 4×4','A5 2×3','A5 3×3',
  'Portfolio 3 anneaux','Zipfolio 9 pochettes',
  'Zipfolio 12 pochettes','Classeur à vis','Autre'
];

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let S = (() => { try { return JSON.parse(localStorage.getItem(SK+'_cache'))||{}; } catch { return {}; } })();
S.binders ??= [];

let color1     = COLORS[0];
let color2     = COLORS[1];
let editId     = null;   // null = create, id = edit
let curBinder  = null;   // binder currently open in detail view
let allSets    = [];     // [{id, name, cardCount}] from TCGdex JP
let selSet     = null;   // set selected in add-set modal
let searchTmr  = null;

// ══════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════
window._appReady = async () => {
  buildColorPickers();
  renderBinders();
  updateStats();
  // load JP sets in background for the search modal
  loadJPSets();
};

// ══════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════
function navTo(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.getElementById('view' + view.charAt(0).toUpperCase() + view.slice(1)).classList.add('on');
  document.querySelectorAll('.top-nav-btn').forEach(b => b.classList.remove('on'));
  if (view === 'binders') {
    document.getElementById('navBinders').classList.add('on');
    renderBinders(); updateStats();
  }
}

function comingSoon() { showToast('Cette section arrive bientôt !', ''); }

// ══════════════════════════════════════════════════
// COLOR PICKERS
// ══════════════════════════════════════════════════
function buildColorPickers() {
  buildPicker('colorRow1', 0, () => { color1 = arguments[0]; updateGradPreview(); });
  buildPicker('colorRow2', 1, () => { color2 = arguments[0]; updateGradPreview(); });
}

function buildPicker(rowId, defaultIdx, onPick) {
  const row = document.getElementById(rowId);
  row.innerHTML = '';
  const isRow1 = rowId === 'colorRow1';

  COLORS.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'csw' + (i === defaultIdx ? ' on' : '');
    d.style.cssText = `background:${c};color:${c}`;
    d.onclick = () => {
      row.querySelectorAll('.csw').forEach(x => x.classList.remove('on'));
      d.classList.add('on');
      if (isRow1) color1 = c; else color2 = c;
      updateGradPreview();
    };
    row.appendChild(d);
  });
  // custom
  const wrap = document.createElement('div'); wrap.className = 'cpwrap';
  const sw   = document.createElement('div'); sw.className   = 'csw rainbow';
  const inp  = document.createElement('input'); inp.type = 'color';
  inp.value  = isRow1 ? '#1d4ed8' : '#7c3aed';
  inp.oninput = e => {
    row.querySelectorAll('.csw').forEach(x => x.classList.remove('on'));
    sw.classList.add('on');
    if (isRow1) color1 = e.target.value; else color2 = e.target.value;
    updateGradPreview();
  };
  wrap.appendChild(sw); wrap.appendChild(inp); row.appendChild(wrap);
}

function updateGradPreview() {
  document.getElementById('gradPreview').style.background =
    `linear-gradient(135deg, ${color1}, ${color2})`;
}

// ══════════════════════════════════════════════════
// TCGdex — LOAD JP SETS
// ══════════════════════════════════════════════════
async function loadJPSets() {
  if (allSets.length) return;
  try {
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch(`${TCG}/ja/sets`, { signal: ctrl.signal });
    clearTimeout(timer);
    const raw = await r.json();
    const sets = Array.isArray(raw) ? raw : (raw?.data || []);
    allSets = sets.map(s => ({
      id:    s.id,
      name:  s.name,
      total: s.cardCount?.official ?? s.cardCount?.total ?? null
    })).filter(s => s.id && s.name);
  } catch(e) {
    console.warn('Could not load JP sets:', e);
  }
}

// ══════════════════════════════════════════════════
// BINDERS — RENDER
// ══════════════════════════════════════════════════
function renderBinders() {
  const grid = document.getElementById('bindersGrid');
  document.getElementById('binderCount').textContent = S.binders.length;

  if (!S.binders.length) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-ico">📚</div>
        <h3>Aucun classeur pour l'instant</h3>
        <p>Crée ton premier classeur pour commencer à organiser ta collection.</p>
        <button class="btn" onclick="openCreateModal()">+ Créer un classeur</button>
      </div>`;
    return;
  }

  grid.innerHTML = S.binders.map(b => binderCardHTML(b)).join('');
}

function getBinderValue(b) {
  // Try to read items from localStorage to compute estimated value
  try {
    var raw = localStorage.getItem('items_v1_cache');
    if (!raw) return null;
    var itemsData = JSON.parse(raw);
    var items = itemsData.items || [];
    // Match items whose name contains any set name in the binder
    var setNames = (b.sets||[]).map(s=>s.name.toLowerCase());
    if (!setNames.length) return null;
    var total = 0; var count = 0;
    items.forEach(function(it) {
      if (!it.prixMarche) return;
      var nm = (it.name||'').toLowerCase();
      if (setNames.some(function(sn){ return nm.includes(sn) || sn.includes(nm.split(' ')[0]); })) {
        total += parseFloat(it.prixMarche) * (it.qte||1);
        count++;
      }
    });
    return count > 0 ? { value: total, count } : null;
  } catch(e) { return null; }
}

function binderCardHTML(b) {
  const sets   = b.sets || [];
  const pct    = calcCompletion(sets);
  const c1     = b.color1 || '#1d4ed8';
  const c2     = b.color2 || '#7c3aed';
  const top3   = sets.slice(0, 3);
  const more   = sets.length - 3;

  const tags = top3.map(s => {
    const st = STATUS[s.status] || STATUS[0];
    return `<span class="set-tag status-${['none','wip','done','master','done','wish','trade'][s.status]||'none'}">${STATUS[s.status]?.label.split(' ')[0]} ${esc(s.name)}</span>`;
  }).join('') + (more > 0 ? `<span class="set-tag status-none">+${more} autre${more>1?'s':''}</span>` : '');

  return `
  <div class="binder-card" onclick="openBinder('${b.id}')">
    <div class="binder-card-top" style="background:linear-gradient(135deg,${c1},${c2})">
      <span class="binder-card-icon">📘</span>
      <div class="binder-card-acts">
        <button class="icon-btn" onclick="event.stopPropagation();openEditFor('${b.id}')" title="Modifier">✏️</button>
        <button class="icon-btn" onclick="event.stopPropagation();deleteBinderById('${b.id}')" title="Supprimer">🗑</button>
      </div>
    </div>
    <div class="binder-card-body">
      <div class="binder-card-name">${esc(b.name)}</div>
      <div class="binder-card-meta">
        <span>📐 ${esc(b.format||'—')}</span>
        <span>📄 ${b.pages||'?'} pages</span>
        <span>🗂 ${sets.length} set${sets.length!==1?'s':''}</span>
        ${(()=>{const v=getBinderValue(b);return v?`<span style="color:var(--gold)">💰 ~${v.value.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} €</span>`:''})()}
      </div>
      <div class="set-tags">${tags || '<span class="set-tag status-none">Aucun set ajouté</span>'}</div>
      <div class="pbar-wrap">
        <div class="pbar"><div class="pbar-fill" style="background:linear-gradient(90deg,${c1},${c2});width:${pct}%"></div></div>
        <span class="pbar-pct">${pct}%</span>
      </div>
    </div>
  </div>`;
}

function calcCompletion(sets) {
  if (!sets.length) return 0;
  const total = sets.reduce((a, s) => a + (STATUS_PCT[s.status] ?? 0), 0);
  return Math.round(total / sets.length);
}

// ══════════════════════════════════════════════════
// STATS
// ══════════════════════════════════════════════════
function updateStats() {
  const allSetsUsed = S.binders.flatMap(b => b.sets || []);
  document.getElementById('statBinders').textContent = S.binders.length;
  document.getElementById('statSets').textContent    = allSetsUsed.length;
  document.getElementById('statFull').textContent    = allSetsUsed.filter(s => s.status === 2).length;
  document.getElementById('statMaster').textContent  = allSetsUsed.filter(s => s.status === 3).length;
}

// ══════════════════════════════════════════════════
// BINDER DETAIL
// ══════════════════════════════════════════════════
function openBinder(id) {
  curBinder = S.binders.find(b => b.id === id);
  if (!curBinder) return;
  navTo('detail');
  renderDetail();
}

function renderDetail() {
  const b   = curBinder;
  const c1  = b.color1 || '#1d4ed8';
  const c2  = b.color2 || '#7c3aed';
  const pct = calcCompletion(b.sets || []);

  document.getElementById('detailBg').style.background = `linear-gradient(135deg,${c1},${c2})`;
  document.getElementById('detailName').textContent = b.name;
  document.getElementById('detailMeta').innerHTML = `
    <span>📐 ${esc(b.format||'—')}</span>
    <span>📄 ${b.pages||'?'} pages</span>
    <span>🗂 ${(b.sets||[]).length} set${(b.sets||[]).length!==1?'s':''}</span>
    ${b.notes ? `<span>📝 ${esc(b.notes)}</span>` : ''}
  `;
  document.getElementById('detailProgressFill').style.cssText =
    `width:${pct}%;background:linear-gradient(90deg,${c1},${c2})`;
  document.getElementById('detailProgressPct').textContent = pct + '%';

  const list = document.getElementById('detailSetsList');
  if (!b.sets || !b.sets.length) {
    list.innerHTML = `
      <div class="empty" style="padding:32px 20px">
        <div class="empty-ico">🗂</div>
        <h3>Aucun set ajouté</h3>
        <p>Clique sur "+ Ajouter un set" pour remplir ce classeur.</p>
      </div>`;
    return;
  }

  list.innerHTML = '';
  b.sets.forEach((s, i) => {
    const st      = STATUS[s.status] || STATUS[0];
    const stCls   = st.cls;
    const ownedStr = s.owned != null ? s.owned : '—';
    const totalStr = s.total != null ? s.total : '—';
    const cardStr  = (s.owned != null || s.total != null) ? `${ownedStr} / ${totalStr}` : '—';
    const rowPct   = s.owned != null && s.total ? Math.round(s.owned/s.total*100) : (STATUS_PCT[s.status]??0);

    const rowEl = document.createElement('div');
    rowEl.className   = 'set-row-item';
    rowEl.draggable   = true;
    rowEl.dataset.idx = i;
    rowEl.innerHTML   = `
      <div class="drag-handle" title="Glisser pour réordonner">⠿</div>
      <div>
        <div class="set-row-name">${esc(s.name)}</div>
        <div class="set-row-sub">${s.id ? `ID: ${esc(s.id)}` : ''}${s.date ? ` · 📅 ${s.date}` : ''}${s.notes ? ` · ${esc(s.notes)}` : ''}</div>
      </div>
      <div class="set-row-cards">${cardStr}</div>
      <div><span class="status-badge ${stCls}">${st.label}</span></div>
      <div class="pbar-wrap" style="gap:6px">
        <div class="pbar" style="height:4px"><div class="pbar-fill" style="background:linear-gradient(90deg,${c1},${c2});width:${rowPct}%"></div></div>
        <span class="pbar-pct" style="font-size:.7rem">${rowPct}%</span>
      </div>
      <div style="display:flex;gap:4px">
        <button class="icon-btn" style="background:rgba(239,68,68,.2)" onclick="removeSet(${i})" title="Retirer">✕</button>
      </div>`;

    // ── Drag & drop pour réordonner ───────────────────
    rowEl.addEventListener('dragstart', e => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i));
      setTimeout(() => rowEl.style.opacity = '0.4', 0);
    });
    rowEl.addEventListener('dragend', () => {
      rowEl.style.opacity = '';
      list.querySelectorAll('.set-row-item').forEach(r => r.classList.remove('drag-over'));
    });
    rowEl.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      list.querySelectorAll('.set-row-item').forEach(r => r.classList.remove('drag-over'));
      rowEl.classList.add('drag-over');
    });
    rowEl.addEventListener('dragleave', () => rowEl.classList.remove('drag-over'));
    rowEl.addEventListener('drop', e => {
      e.preventDefault();
      const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      const toIdx   = parseInt(rowEl.dataset.idx);
      if (fromIdx === toIdx || isNaN(fromIdx) || isNaN(toIdx)) return;
      const [moved] = curBinder.sets.splice(fromIdx, 1);
      curBinder.sets.splice(toIdx, 0, moved);
      save(); renderDetail();
      showToast('Sets réordonnés ✔', 'ok');
    });

    list.appendChild(rowEl);
  });
}

function removeSet(idx) {
  if (!curBinder) return;
  curBinder.sets.splice(idx, 1);
  save(); renderDetail(); updateStats();
  showToast('Set retiré', 'ok');
}

// ══════════════════════════════════════════════════
// CREATE / EDIT BINDER MODAL
// ══════════════════════════════════════════════════
function openCreateModal() {
  editId = null;
  document.getElementById('modalCreateTitle').textContent = '📘 Nouveau classeur';
  document.getElementById('modalCreateBtn').textContent   = 'Créer le classeur';
  document.getElementById('fname').value   = '';
  document.getElementById('fpages').value  = '';
  document.getElementById('fnotes').value  = '';
  document.getElementById('fformat').value = 'A4 2×4';
  color1 = COLORS[0]; color2 = COLORS[1];
  buildPicker('colorRow1', 0, null);
  buildPicker('colorRow2', 1, null);
  updateGradPreview();
  document.getElementById('modalCreate').classList.add('open');
}

function openEditFor(id) {
  const b = S.binders.find(x => x.id === id);
  if (!b) return;
  editId = id;
  document.getElementById('modalCreateTitle').textContent = '✏️ Modifier le classeur';
  document.getElementById('modalCreateBtn').textContent   = 'Enregistrer';
  document.getElementById('fname').value   = b.name;
  document.getElementById('fpages').value  = b.pages || '';
  document.getElementById('fnotes').value  = b.notes || '';
  document.getElementById('fformat').value = b.format || 'A4 2×4';
  color1 = b.color1 || COLORS[0];
  color2 = b.color2 || COLORS[1];
  buildPicker('colorRow1', COLORS.indexOf(color1), null);
  buildPicker('colorRow2', COLORS.indexOf(color2), null);
  updateGradPreview();
  document.getElementById('modalCreate').classList.add('open');
}

function openEditModal() {
  if (curBinder) openEditFor(curBinder.id);
}

function closeCreateModal() {
  document.getElementById('modalCreate').classList.remove('open');
}

function saveBinder() {
  const name   = document.getElementById('fname').value.trim();
  const pages  = parseInt(document.getElementById('fpages').value) || null;
  const notes  = document.getElementById('fnotes').value.trim();
  const format = document.getElementById('fformat').value;

  if (!name) { showToast('Donne un nom au classeur !', 'err'); return; }

  if (editId) {
    const b = S.binders.find(x => x.id === editId);
    if (b) { b.name=name; b.pages=pages; b.notes=notes; b.format=format; b.color1=color1; b.color2=color2; }
    showToast('Classeur modifié ✔', 'ok');
  } else {
    S.binders.unshift({ id: Date.now().toString(), name, pages, notes, format, color1, color2, sets: [], createdAt: Date.now() });
    showToast('Classeur créé ✔', 'ok');
  }

  closeCreateModal();
  save(); renderBinders(); updateStats();
  // if editing from detail view, re-render detail
  if (editId && curBinder?.id === editId) { curBinder = S.binders.find(x=>x.id===editId); renderDetail(); }
}

// ══════════════════════════════════════════════════
// ADD SET MODAL
// ══════════════════════════════════════════════════
function openAddSetModal() {
  selSet = null;
  document.getElementById('setSearchInput').value = '';
  document.getElementById('setSearchResults').style.display = 'none';
  document.getElementById('setSelectedInfo').style.display  = 'none';
  document.getElementById('fsetStatus').value = '0';
  document.getElementById('fsetOwned').value  = '';
  document.getElementById('fsetNotes').value  = '';
  document.getElementById('modalAddSet').classList.add('open');
  document.getElementById('setSearchInput').focus();
  if (!allSets.length) loadJPSets();
}

function closeAddSetModal() {
  document.getElementById('modalAddSet').classList.remove('open');
}

function searchSets() {
  clearTimeout(searchTmr);
  searchTmr = setTimeout(_doSearch, 200);
}

function _doSearch() {
  const q   = document.getElementById('setSearchInput').value.trim().toLowerCase();
  const box = document.getElementById('setSearchResults');

  if (!q) { box.style.display = 'none'; return; }

  let results = allSets.filter(s =>
    s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q)
  ).slice(0, 12);

  if (!results.length) {
    // no TCGdex match → offer manual entry
    results = [{ id: '', name: q, total: null, _manual: true }];
  }

  box.innerHTML = results.map(s => `
    <div class="set-search-item" onclick="selectSet(${JSON.stringify(s).replace(/"/g,'&quot;')})">
      <div>
        <div class="ssi-name">${esc(s.name)}${s._manual?' <em style="color:var(--mist);font-size:.72rem">(saisie libre)</em>':''}</div>
        ${s.id ? `<div class="ssi-id">${esc(s.id)}</div>` : ''}
      </div>
      ${s.total != null ? `<span class="ssi-count">${s.total} cartes</span>` : ''}
    </div>`).join('');

  box.style.display = 'block';
}

function selectSet(s) {
  selSet = s;
  document.getElementById('setSearchInput').value = s.name;
  document.getElementById('setSearchResults').style.display = 'none';
  document.getElementById('setSelectedInfo').style.display  = 'block';
  document.getElementById('setSelName').textContent = s.name;
  document.getElementById('setSelSub').textContent  =
    [s.id ? 'ID: '+s.id : '', s.total ? s.total+' cartes' : ''].filter(Boolean).join(' · ');
  if (s.total != null) document.getElementById('fsetOwned').placeholder = `Max: ${s.total}`;
}

function addSetToBinder() {
  if (!curBinder) return;

  const q      = document.getElementById('setSearchInput').value.trim();
  const status = parseInt(document.getElementById('fsetStatus').value);
  const owned  = document.getElementById('fsetOwned').value !== '' ? parseInt(document.getElementById('fsetOwned').value) : null;
  const notes  = document.getElementById('fsetNotes').value.trim();

  const setName = (selSet?.name || q).trim();
  if (!setName) { showToast('Indique un set !', 'err'); return; }

  // Check duplicate
  if (curBinder.sets.find(s => s.name === setName && s.id === (selSet?.id||''))) {
    showToast('Ce set est déjà dans le classeur !', 'err'); return;
  }

  var dateVal = document.getElementById('fsetDate')?.value || '';
  curBinder.sets.push({
    id:     selSet?.id    || '',
    name:   setName,
    total:  selSet?.total ?? null,
    status, owned, notes,
    date:   dateVal || null,
    addedAt: Date.now()
  });

  save(); closeAddSetModal(); renderDetail(); updateStats();
  showToast(`${setName} ajouté ✔`, 'ok');
}

// ══════════════════════════════════════════════════
// DELETE
// ══════════════════════════════════════════════════
function deleteBinder() {
  if (!curBinder || !confirm(`Supprimer « ${curBinder.name} » et tous ses sets ?`)) return;
  S.binders = S.binders.filter(b => b.id !== curBinder.id);
  curBinder = null;
  save(); navTo('binders');
  showToast('Classeur supprimé', 'ok');
}
function deleteBinderById(id) {
  const b = S.binders.find(x => x.id === id);
  if (!b || !confirm(`Supprimer « ${b.name} » ?`)) return;
  S.binders = S.binders.filter(x => x.id !== id);
  if (curBinder?.id === id) curBinder = null;
  save(); renderBinders(); updateStats();
  showToast('Classeur supprimé', 'ok');
}

// ══════════════════════════════════════════════════
// FIREBASE SYNC
// ══════════════════════════════════════════════════
function save() {
  try { localStorage.setItem(SK+'_cache', JSON.stringify(S)); } catch(e) {}
  if (!window._uid) return;
  clearTimeout(window._saveT);
  window._saveT = setTimeout(async () => {
    try {
      await window._setDoc(window._doc(window._db,'binders_v2',window._uid), { binders: S.binders });
    } catch(e) { console.warn('Firestore save:', e); }
  }, 900);
}

// ══════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════
function logout() {
  window._signOut(window._auth).then(() => { window.location.href = 'index.html'; });
}

let _toastT;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast on' + (type ? ' '+type : '');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('on'), 2800);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close modals on background click
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => {
    if (e.target === o) {
      o.classList.remove('open');
    }
  });
});
</script>
</body>
</html>
