<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="apple-touch-icon" href="favicon-180.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wishlist — My Collection TCG</title>

<script type="module">
import { initializeApp }                        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCgCTF7sndU-q-eFvwiTKz_8C0a3JfZ0H4",authDomain:"ma-collection-69003.firebaseapp.com",projectId:"ma-collection-69003",storageBucket:"ma-collection-69003.firebasestorage.app",messagingSenderId:"902502189555",appId:"1:902502189555:web:db73883fe242306da96a86"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
window._auth=auth;window._db=db;window._signOut=signOut;window._doc=doc;window._setDoc=setDoc;window._getDoc=getDoc;
onAuthStateChanged(auth,async user=>{
  if(!user){window.location.href='index.html';return;}
  window._uid=user.uid;window._email=user.email||user.displayName||'';
  document.getElementById('hdrEmail').textContent=window._email;
  try{const snap=await getDoc(doc(db,'wishlist_v1',user.uid));if(snap.exists()){const d=snap.data();S.items=d.items||[];}}catch(e){console.warn('load:',e);}
  if(window._ready)window._ready();
});
</script>

<style>
:root{
  --bg:#05080d;--s1:#0c1520;--s2:#111f2e;--s3:#16273a;
  --bd:#1a2e42;--bd2:#223344;
  --gold:#f5c400;--green:#22c55e;--red:#ef4444;
  --blue:#3b82f6;--purple:#a855f7;--orange:#f97316;
  --fog:#4a6278;--mist:#7a96aa;--snow:#dce8f2;
  --r:10px;--shadow:0 8px 32px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--snow);min-height:100vh;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px;}

/* HEADER */
.hdr{height:54px;background:linear-gradient(135deg,#0a1220,#0f1c2e);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.5);}
.home-link{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--mist);font-size:.82rem;font-weight:700;padding:5px 12px;border-radius:8px;border:1px solid var(--bd);transition:all .18s;flex-shrink:0;}
.home-link:hover{color:var(--gold);border-color:rgba(245,196,0,.4);background:rgba(245,196,0,.06);}
.hdr-sep{width:1px;height:26px;background:var(--bd);}
.hdr-logo{font-size:1.05rem;font-weight:800;color:var(--snow);letter-spacing:-.3px;display:flex;align-items:center;gap:7px;}
.hdr-logo em{color:var(--gold);font-style:normal;}
.bolt{width:24px;height:24px;background:var(--gold);clip-path:polygon(60% 0%,100% 40%,65% 45%,100% 100%,35% 55%,70% 50%,30% 0%);}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.hdr-email{font-size:.74rem;color:var(--fog);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-logout{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;padding:5px 11px;border-radius:7px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;}

/* LAYOUT */
.app{display:flex;height:calc(100vh - 54px);overflow:hidden;}

/* SIDEBAR */
.sidebar{width:240px;min-width:240px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.sb-head{padding:16px;border-bottom:1px solid var(--bd);}
.sb-title{font-size:.65rem;font-weight:700;color:var(--fog);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;}
.sb-stat{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;}
.sb-stat-label{font-size:.65rem;font-weight:700;color:var(--fog);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.sb-stat-val{font-size:1.4rem;font-weight:900;color:var(--snow);}
.sb-stat-val.gold{color:var(--gold);}
.sb-stat-val.purple{color:var(--purple);}
.sb-stat-sub{font-size:.7rem;color:var(--mist);margin-top:2px;}

.sb-filters{flex:1;overflow-y:auto;padding:14px;}
.sb-filter-title{font-size:.65rem;font-weight:700;color:var(--fog);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;margin-top:14px;}
.sb-filter-title:first-child{margin-top:0;}
.filter-chip{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:7px;cursor:pointer;transition:background .12s;font-size:.84rem;}
.filter-chip:hover{background:var(--s2);}
.filter-chip.on{background:rgba(245,196,0,.09);color:var(--gold);}
.filter-chip .chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.filter-chip .chip-count{margin-left:auto;font-size:.68rem;color:var(--fog);background:var(--s2);padding:1px 6px;border-radius:10px;}

/* MAIN */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.main-bar{padding:12px 20px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.main-bar-title{font-size:1rem;font-weight:800;}
.search-box{background:var(--s2);border:1px solid var(--bd2);color:var(--snow);padding:8px 13px;border-radius:8px;font-size:.86rem;outline:none;width:200px;font-family:inherit;transition:border-color .15s;}
.search-box:focus{border-color:var(--gold);}
.search-box::placeholder{color:var(--fog);}
.sort-sel{background:var(--s2);border:1px solid var(--bd);color:var(--snow);padding:7px 10px;border-radius:8px;font-size:.8rem;outline:none;font-family:inherit;}
.view-toggle{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:8px;overflow:hidden;}
.vt-btn{background:transparent;border:none;color:var(--mist);padding:7px 11px;cursor:pointer;font-size:.9rem;transition:all .15s;}
.vt-btn.on{background:rgba(245,196,0,.12);color:var(--gold);}
.vt-btn:hover:not(.on){background:rgba(255,255,255,.05);}
.content{flex:1;overflow-y:auto;padding:20px;}

/* BUTTONS */
.btn{background:var(--gold);color:#000;border:none;padding:10px 18px;border-radius:9px;font-weight:800;font-size:.88rem;cursor:pointer;transition:opacity .15s,transform .1s;font-family:inherit;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{opacity:.87;}.btn:active{transform:scale(.97);}
.btn.ghost{background:var(--s2);color:var(--snow);border:1px solid var(--bd);font-weight:600;}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold);background:rgba(245,196,0,.06);}
.btn.sm{padding:7px 13px;font-size:.8rem;}
.btn.xs{padding:4px 9px;font-size:.72rem;}
.btn.green{background:var(--green);color:#000;}
.btn.danger{background:var(--red);color:#fff;}

/* WISH CARD GRID */
.wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.wish-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:transform .18s,box-shadow .18s,border-color .18s;}
.wish-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.6);border-color:var(--bd2);}
.wish-card-pri-high  {border-color:rgba(239,68,68,.4)!important;}
.wish-card-pri-med   {border-color:rgba(245,158,11,.3)!important;}
.wish-card-pri-low   {border-color:rgba(34,197,94,.2)!important;}
.wish-card-acquired  {border-color:rgba(34,197,94,.5)!important;opacity:.7;}
.wish-img{width:100%;height:150px;object-fit:cover;display:block;background:var(--s2);}
.wish-img-ph{width:100%;height:150px;background:linear-gradient(135deg,var(--s2),var(--s3));display:flex;align-items:center;justify-content:center;font-size:3rem;}
.wish-body{padding:12px 14px 14px;}
.wish-name{font-size:.95rem;font-weight:800;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wish-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.chip{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap;}
.chip-pri-high  {background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5;}
.chip-pri-med   {background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#fcd34d;}
.chip-pri-low   {background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#86efac;}
.chip-acquired  {background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#4ade80;}
.chip-game-pokemon{background:rgba(250,204,21,.1);border-color:rgba(250,204,21,.3);color:#fde68a;}
.chip-game-op  {background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5;}
.chip-game-lorcana{background:rgba(168,85,247,.1);border-color:rgba(168,85,247,.3);color:#d8b4fe;}
.chip-game-magic{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#fcd34d;}
.chip-game-autre{background:rgba(107,114,128,.1);border-color:rgba(107,114,128,.3);color:#9ca3af;}
.wish-budget{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;}
.price-label{font-size:.63rem;color:var(--fog);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.price-val{font-size:.95rem;font-weight:800;color:var(--gold);}
.wish-acts{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.wish-card:hover .wish-acts{opacity:1;}
.icon-btn{background:rgba(0,0,0,.65);border:none;color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:.78rem;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.icon-btn:hover{background:rgba(0,0,0,.9);}
.acquired-badge{position:absolute;top:8px;left:8px;background:rgba(34,197,94,.9);color:#000;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:10px;pointer-events:none;}

/* TABLE VIEW */
.wish-table{width:100%;border-collapse:collapse;}
.wish-table th{text-align:left;padding:10px 14px;font-size:.7rem;font-weight:700;color:var(--fog);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bd);background:var(--s1);position:sticky;top:0;}
.wish-table td{padding:11px 14px;border-bottom:1px solid var(--bd);font-size:.88rem;vertical-align:middle;}
.wish-table tr:hover td{background:var(--s2);}
.wish-table tr.acquired td{opacity:.6;}
.td-img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--s2);}
.td-img-ph{width:44px;height:44px;border-radius:6px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
.td-name{font-weight:700;}
.td-sub{font-size:.72rem;color:var(--mist);margin-top:2px;}
.td-acts{display:flex;gap:4px;justify-content:flex-end;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:600;align-items:flex-start;justify-content:center;overflow-y:auto;padding:32px 20px;backdrop-filter:blur(4px);}
.overlay.open{display:flex;}
.modal{background:var(--s1);border:1px solid var(--bd2);border-radius:16px;padding:28px;width:100%;max-width:560px;box-shadow:0 32px 64px rgba(0,0,0,.7);animation:modIn .2s cubic-bezier(.22,.68,0,1.2);margin:auto;}
@keyframes modIn{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:none;}}
.modal-title{font-size:1.15rem;font-weight:900;margin-bottom:20px;display:flex;align-items:center;gap:9px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:.74rem;font-weight:700;color:var(--mist);text-transform:uppercase;letter-spacing:.06em;}
input[type=text],input[type=number],input[type=url],input[type=date],select,textarea{background:var(--s2);border:1px solid var(--bd2);color:var(--snow);padding:11px 14px;border-radius:9px;font-size:.92rem;outline:none;width:100%;font-family:inherit;transition:border-color .18s,box-shadow .18s;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,196,0,.1);}
input::placeholder,textarea::placeholder{color:var(--fog);}
select option{background:var(--s2);}
.fields-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;}
.modal-acts-left{margin-right:auto;display:flex;gap:8px;}

/* Acquire confirm */
.acquire-banner{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:9px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:.84rem;}

/* EMPTY */
.empty{text-align:center;padding:60px 24px;background:var(--s1);border:1px dashed var(--bd);border-radius:14px;}
.empty-ico{font-size:3rem;margin-bottom:14px;}
.empty h3{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.empty p{font-size:.88rem;color:var(--mist);margin-bottom:20px;}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--s1);border:1px solid var(--bd2);border-left:3px solid var(--gold);color:var(--snow);padding:10px 16px;border-radius:9px;font-size:.84rem;box-shadow:var(--shadow);z-index:1000;transform:translateY(80px);opacity:0;transition:transform .28s cubic-bezier(.22,.68,0,1.2),opacity .22s;pointer-events:none;max-width:300px;}
.toast.on{transform:translateY(0);opacity:1;}
.toast.ok{border-left-color:var(--green);}
.toast.err{border-left-color:var(--red);}
.toast.info{border-left-color:var(--blue);}

/* Detail overlay */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:700;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.detail-overlay.open{display:flex;}
.detail-panel{background:var(--s1);border:1px solid var(--bd2);border-radius:16px;width:100%;max-width:560px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.8);animation:modIn .2s cubic-bezier(.22,.68,0,1.2);margin:20px;}
.detail-panel-img{width:100%;max-height:240px;object-fit:contain;background:var(--s2);display:block;}
.detail-panel-img-ph{width:100%;height:180px;background:linear-gradient(135deg,var(--s2),var(--s3));display:flex;align-items:center;justify-content:center;font-size:4rem;}
.detail-body{padding:20px;}
.detail-name{font-size:1.2rem;font-weight:900;margin-bottom:8px;}
.detail-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.detail-field{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 13px;}
.detail-field-label{font-size:.65rem;font-weight:700;color:var(--fog);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.detail-field-val{font-size:.92rem;font-weight:600;}
.detail-field-val.gold{color:var(--gold);}
.detail-acts{display:flex;gap:8px;flex-wrap:wrap;}

@media(max-width:700px){.sidebar{display:none;}.fields-row{grid-template-columns:1fr;}.wish-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}}
</style>
</head>
<body>

<header class="hdr">
  <a href="index.html" class="home-link">⚡ Accueil</a>
  <div class="hdr-sep"></div>
  <div class="hdr-logo"><div class="bolt"></div>My Collection <em>TCG</em></div>
  <div class="hdr-right">
    <span class="hdr-email" id="hdrEmail"></span>
    <button class="btn-logout" onclick="logout()">🚪 Déconnexion</button>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-title">Statistiques</div>
      <div class="sb-stat"><div class="sb-stat-label">Total wishlist</div><div class="sb-stat-val" id="statTotal">0</div></div>
      <div class="sb-stat"><div class="sb-stat-label">Budget max total</div><div class="sb-stat-val gold" id="statBudget">0,00 €</div></div>
      <div class="sb-stat"><div class="sb-stat-label">Acquis</div><div class="sb-stat-val" style="color:var(--green)" id="statAcquis">0</div><div class="sb-stat-sub" id="statRestants">0 restants</div></div>
    </div>
    <div class="sb-filters">
      <div class="sb-filter-title">Priorité</div>
      <div class="filter-chip on" data-f="pri" data-v="" onclick="toggleFilter(this)"><span class="chip-dot" style="background:var(--mist)"></span>Toutes<span class="chip-count" id="fc-pri-all">0</span></div>
      <div class="filter-chip" data-f="pri" data-v="high" onclick="toggleFilter(this)"><span class="chip-dot" style="background:var(--red)"></span>Haute<span class="chip-count" id="fc-pri-high">0</span></div>
      <div class="filter-chip" data-f="pri" data-v="med" onclick="toggleFilter(this)"><span class="chip-dot" style="background:var(--orange)"></span>Moyenne<span class="chip-count" id="fc-pri-med">0</span></div>
      <div class="filter-chip" data-f="pri" data-v="low" onclick="toggleFilter(this)"><span class="chip-dot" style="background:var(--green)"></span>Basse<span class="chip-count" id="fc-pri-low">0</span></div>
      <div class="sb-filter-title">Statut</div>
      <div class="filter-chip on" data-f="status" data-v="" onclick="toggleFilter(this)"><span class="chip-dot" style="background:var(--mist)"></span>Tous<span class="chip-count" id="fc-status-all">0</span></div>
      <div class="filter-chip" data-f="status" data-v="want" onclick="toggleFilter(this)"><span class="chip-dot" style="background:var(--blue)"></span>À acquérir<span class="chip-count" id="fc-status-want">0</span></div>
      <div class="filter-chip" data-f="status" data-v="acquired" onclick="toggleFilter(this)"><span class="chip-dot" style="background:var(--green)"></span>Acquis<span class="chip-count" id="fc-status-acquired">0</span></div>
      <div class="sb-filter-title">Jeu</div>
      <div class="filter-chip on" data-f="jeu" data-v="" onclick="toggleFilter(this)"><span class="chip-dot" style="background:var(--mist)"></span>Tous<span class="chip-count" id="fc-jeu-all">0</span></div>
      <div class="filter-chip" data-f="jeu" data-v="pokemon" onclick="toggleFilter(this)"><span class="chip-dot" style="background:#fde68a"></span>Pokémon<span class="chip-count" id="fc-jeu-pokemon">0</span></div>
      <div class="filter-chip" data-f="jeu" data-v="op" onclick="toggleFilter(this)"><span class="chip-dot" style="background:#fca5a5"></span>One Piece<span class="chip-count" id="fc-jeu-op">0</span></div>
      <div class="filter-chip" data-f="jeu" data-v="lorcana" onclick="toggleFilter(this)"><span class="chip-dot" style="background:#d8b4fe"></span>Lorcana<span class="chip-count" id="fc-jeu-lorcana">0</span></div>
      <div class="filter-chip" data-f="jeu" data-v="magic" onclick="toggleFilter(this)"><span class="chip-dot" style="background:#fcd34d"></span>Magic<span class="chip-count" id="fc-jeu-magic">0</span></div>
      <div class="filter-chip" data-f="jeu" data-v="autre" onclick="toggleFilter(this)"><span class="chip-dot" style="background:#9ca3af"></span>Autre<span class="chip-count" id="fc-jeu-autre">0</span></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-area">
    <div class="main-bar">
      <span class="main-bar-title">🎯 Ma Wishlist</span>
      <input class="search-box" id="searchBox" placeholder="🔍 Rechercher…" oninput="render()"/>
      <select class="sort-sel" id="sortSel" onchange="render()">
        <option value="pri-desc">Priorité ↓</option>
        <option value="date-desc">Plus récents</option>
        <option value="budget-desc">Budget ↓</option>
        <option value="budget-asc">Budget ↑</option>
        <option value="name-asc">Nom A→Z</option>
      </select>
      <div class="view-toggle">
        <button class="vt-btn on" id="vt-grid" onclick="setView('grid')" title="Grille">⊞</button>
        <button class="vt-btn" id="vt-list" onclick="setView('list')" title="Liste">☰</button>
      </div>
      <button class="btn" onclick="openModal()">+ Ajouter</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL ADD/EDIT -->
<div id="modalWish" class="overlay">
<div class="modal">
  <div class="modal-title" id="modalTitle">🎯 Nouvel item</div>
  <div class="field"><label>Nom *</label><input type="text" id="wName" placeholder="Ex: Display SV10 JP Scellé"/></div>
  <div class="fields-row">
    <div class="field"><label>Jeu</label>
      <select id="wJeu">
        <option value="pokemon">🟡 Pokémon</option>
        <option value="op">🔴 One Piece</option>
        <option value="lorcana">🟣 Lorcana</option>
        <option value="magic">🟠 Magic</option>
        <option value="autre">⚪ Autre</option>
      </select>
    </div>
    <div class="field"><label>Priorité</label>
      <select id="wPri">
        <option value="high">🔴 Haute</option>
        <option value="med" selected>🟡 Moyenne</option>
        <option value="low">🟢 Basse</option>
      </select>
    </div>
  </div>
  <div class="fields-row">
    <div class="field"><label>Budget max (€)</label><input type="number" id="wBudget" placeholder="Ex: 120" step="0.01" min="0"/></div>
    <div class="field"><label>Prix actuel observé (€)</label><input type="number" id="wPrixActuel" placeholder="Ex: 95" step="0.01" min="0"/></div>
  </div>
  <div class="field"><label>Lien Cardmarket</label>
    <div style="display:flex;gap:8px">
      <input type="url" id="wCmLink" placeholder="https://www.cardmarket.com/…" style="flex:1"/>
      <button class="btn ghost sm" onclick="openWCM()">🔍</button>
    </div>
  </div>
  <div class="fields-row">
    <div class="field"><label>Date cible (pour quand)</label><input type="date" id="wDate"/></div>
    <div class="field"><label>Image (URL)</label><input type="url" id="wImg" placeholder="https://…" oninput="previewWImg()"/></div>
  </div>
  <img id="wImgPreview" style="width:100%;height:100px;object-fit:contain;border-radius:9px;background:var(--s2);border:1px solid var(--bd2);margin-bottom:12px;display:none" referrerpolicy="no-referrer"/>
  <div class="field"><label>Notes</label><textarea id="wNotes" rows="2" placeholder="Vendeur préféré, condition souhaitée…"></textarea></div>
  <div class="modal-acts">
    <div class="modal-acts-left">
      <button class="btn danger sm" id="wDeleteBtn" onclick="deleteItem()" style="display:none">🗑 Supprimer</button>
    </div>
    <button class="btn ghost" onclick="closeModal()">Annuler</button>
    <button class="btn" onclick="saveItem()">Enregistrer</button>
  </div>
</div>
</div>

<!-- DETAIL OVERLAY -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
<div class="detail-panel">
  <div id="dImgWrap"></div>
  <div class="detail-body">
    <div class="detail-name" id="dName"></div>
    <div class="detail-chips" id="dChips"></div>
    <div class="detail-grid" id="dGrid"></div>
    <div id="dNotes" style="margin-bottom:14px;display:none">
      <div style="font-size:.7rem;font-weight:700;color:var(--fog);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Notes</div>
      <div style="font-size:.86rem;color:var(--mist);line-height:1.5" id="dNotesText"></div>
    </div>
    <div id="dCmWrap" style="margin-bottom:14px;display:none"><a id="dCmLink" href="#" target="_blank" class="btn ghost sm">🔍 Voir sur Cardmarket</a></div>
    <div class="detail-acts">
      <button class="btn green sm" onclick="acquireItem()" id="dAcquireBtn">✅ Marquer comme acquis</button>
      <button class="btn sm" onclick="editFromDetail()">✏️ Modifier</button>
      <button class="btn danger sm" onclick="deleteFromDetail()">🗑</button>
      <button class="btn ghost sm" onclick="document.getElementById('detailOverlay').classList.remove('open')" style="margin-left:auto">Fermer</button>
    </div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SK='wishlist_v1';
let S=(()=>{try{return JSON.parse(localStorage.getItem(SK+'_cache'))||{};}catch{return{};}})();
S.items??=[];

let viewMode='grid', editingId=null, detailId=null;
let fPri='', fStatus='', fJeu='';

const GAME_EMOJI={pokemon:'🟡',op:'🔴',lorcana:'🟣',magic:'🟠',autre:'⚪'};
const GAME_NAME ={pokemon:'Pokémon',op:'One Piece',lorcana:'Lorcana',magic:'Magic',autre:'Autre'};
const PRI_LABEL ={high:'🔴 Haute',med:'🟡 Moyenne',low:'🟢 Basse'};
const PRI_CHIP  ={high:'chip-pri-high',med:'chip-pri-med',low:'chip-pri-low'};
const PRI_SORT  ={high:3,med:2,low:1};

window._ready=()=>{render();updateStats();updateCounts();};
function logout(){window._signOut(window._auth).then(()=>{window.location.href='index.html';});}

function setView(v){
  viewMode=v;
  document.getElementById('vt-grid').classList.toggle('on',v==='grid');
  document.getElementById('vt-list').classList.toggle('on',v==='list');
  render();
}
function toggleFilter(el){
  const f=el.dataset.f, v=el.dataset.v;
  document.querySelectorAll(`.filter-chip[data-f="${f}"]`).forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  if(f==='pri')    fPri=v;
  if(f==='status') fStatus=v;
  if(f==='jeu')    fJeu=v;
  render();
}

function getFiltered(){
  const q=(document.getElementById('searchBox')?.value||'').toLowerCase();
  const sk=document.getElementById('sortSel')?.value||'pri-desc';
  let items=S.items.filter(it=>{
    if(fPri    && it.priority!==fPri)  return false;
    if(fStatus && it.status !==fStatus)return false;
    if(fJeu    && it.jeu    !==fJeu)   return false;
    if(q && !(it.name||'').toLowerCase().includes(q) && !(it.notes||'').toLowerCase().includes(q)) return false;
    return true;
  });
  items.sort((a,b)=>{
    switch(sk){
      case 'pri-desc':   return (PRI_SORT[b.priority]||0)-(PRI_SORT[a.priority]||0);
      case 'date-desc':  return (b.createdAt||0)-(a.createdAt||0);
      case 'budget-desc':return (parseFloat(b.budget)||0)-(parseFloat(a.budget)||0);
      case 'budget-asc': return (parseFloat(a.budget)||0)-(parseFloat(b.budget)||0);
      case 'name-asc':   return (a.name||'').localeCompare(b.name||'');
      default:           return 0;
    }
  });
  return items;
}

function render(){
  const items=getFiltered();
  const el=document.getElementById('content');
  if(!S.items.length){
    el.innerHTML=`<div class="empty"><div class="empty-ico">🎯</div><h3>Ta wishlist est vide</h3><p>Ajoute les cartes et produits que tu veux acquérir.</p><button class="btn" onclick="openModal()">+ Ajouter un item</button></div>`;
    return;
  }
  if(!items.length){
    el.innerHTML=`<div class="empty"><div class="empty-ico">🔍</div><h3>Aucun résultat</h3><p>Essaie d'autres filtres.</p></div>`;
    return;
  }
  if(viewMode==='grid') renderGrid(el,items);
  else renderList(el,items);
}

function wishCardHTML(it){
  const acq=it.status==='acquired';
  const priCls=PRI_CHIP[it.priority]||'chip-pri-med';
  const priLabel=PRI_LABEL[it.priority]||'—';
  const TYPE_EMO={pokemon:'⚡',op:'🏴‍☠️',lorcana:'🌟',magic:'🔮',autre:'📦'};
  const te=TYPE_EMO[it.jeu]||'📦';
  const img=it.img
    ?`<img class="wish-img" src="${esc(it.img)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=wish-img-ph>${te}</div>'" loading="lazy"/>`
    :`<div class="wish-img-ph">${te}</div>`;
  const border=acq?'wish-card-acquired':(it.priority==='high'?'wish-card-pri-high':it.priority==='med'?'wish-card-pri-med':'wish-card-pri-low');
  return `
  <div class="wish-card ${border}" onclick="openDetail('${it.id}')">
    ${img}
    <div class="wish-acts">
      <button class="icon-btn" onclick="event.stopPropagation();openModal('${it.id}')" title="Modifier">✏️</button>
      <button class="icon-btn" onclick="event.stopPropagation();quickDelete('${it.id}')" title="Supprimer">🗑</button>
    </div>
    ${acq?`<div class="acquired-badge">✅ Acquis</div>`:''}
    <div class="wish-body">
      <div class="wish-name">${esc(it.name)}</div>
      <div class="wish-chips">
        <span class="chip ${priCls}">${priLabel}</span>
        <span class="chip chip-game-${it.jeu}">${GAME_EMOJI[it.jeu]||''} ${GAME_NAME[it.jeu]||it.jeu}</span>
      </div>
      ${it.budget||it.prixActuel?`<div class="wish-budget">
        ${it.budget?`<div><div class="price-label">Budget max</div><div class="price-val">${numFmt(it.budget)} €</div></div>`:''}
        ${it.prixActuel?`<div style="text-align:right"><div class="price-label">Actuel</div><div class="price-val" style="color:${parseFloat(it.prixActuel)<=parseFloat(it.budget||9999)?'var(--green)':'var(--red)'}">${numFmt(it.prixActuel)} €</div></div>`:''}
      </div>`:''}
    </div>
  </div>`;
}

function renderGrid(el,items){el.innerHTML=`<div class="wish-grid">${items.map(wishCardHTML).join('')}</div>`;}

function renderList(el,items){
  const rows=items.map(it=>{
    const acq=it.status==='acquired';
    const priCls=PRI_CHIP[it.priority]||'';
    const TYPE_EMO={pokemon:'⚡',op:'🏴‍☠️',lorcana:'🌟',magic:'🔮',autre:'📦'};
    const te=TYPE_EMO[it.jeu]||'📦';
    const img=it.img
      ?`<img class="td-img" src="${esc(it.img)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.outerHTML='<div class=td-img-ph>${te}</div>'"/>`
      :`<div class="td-img-ph">${te}</div>`;
    return `<tr class="${acq?'acquired':''}" onclick="openDetail('${it.id}')" style="cursor:pointer">
      <td>${img}</td>
      <td><div class="td-name">${esc(it.name)}${acq?' ✅':''}</div><div class="td-sub">${GAME_EMOJI[it.jeu]||''} ${GAME_NAME[it.jeu]||it.jeu}</div></td>
      <td><span class="chip ${priCls}">${PRI_LABEL[it.priority]||'—'}</span></td>
      <td style="color:var(--gold);font-weight:700">${it.budget?numFmt(it.budget)+' €':'—'}</td>
      <td style="font-weight:700">${it.prixActuel?numFmt(it.prixActuel)+' €':'—'}</td>
      <td style="font-size:.8rem;color:var(--mist)">${it.date||'—'}</td>
      <td><div class="td-acts">
        <button class="icon-btn" onclick="event.stopPropagation();openModal('${it.id}')" title="Modifier">✏️</button>
        <button class="icon-btn" onclick="event.stopPropagation();quickDelete('${it.id}')" title="Supprimer">🗑</button>
      </div></td>
    </tr>`;
  }).join('');
  el.innerHTML=`<table class="wish-table"><thead><tr>
    <th style="width:56px"></th><th>Nom</th><th>Priorité</th><th>Budget max</th><th>Prix actuel</th><th>Date cible</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function updateStats(){
  const all=S.items;
  const acq=all.filter(i=>i.status==='acquired').length;
  const budget=all.filter(i=>i.status!=='acquired').reduce((a,i)=>a+(parseFloat(i.budget)||0),0);
  document.getElementById('statTotal').textContent=all.length;
  document.getElementById('statBudget').textContent=numFmt(budget)+' €';
  document.getElementById('statAcquis').textContent=acq;
  document.getElementById('statRestants').textContent=(all.length-acq)+' restants';
}

function updateCounts(){
  const all=S.items, cnt=fn=>all.filter(fn).length;
  document.getElementById('fc-pri-all').textContent=all.length;
  ['high','med','low'].forEach(p=>{const el=document.getElementById('fc-pri-'+p);if(el)el.textContent=cnt(i=>i.priority===p);});
  document.getElementById('fc-status-all').textContent=all.length;
  document.getElementById('fc-status-want').textContent=cnt(i=>i.status!=='acquired');
  document.getElementById('fc-status-acquired').textContent=cnt(i=>i.status==='acquired');
  document.getElementById('fc-jeu-all').textContent=all.length;
  ['pokemon','op','lorcana','magic','autre'].forEach(j=>{const el=document.getElementById('fc-jeu-'+j);if(el)el.textContent=cnt(i=>i.jeu===j);});
}

function openModal(id){
  editingId=id||null;
  const it=id?S.items.find(x=>x.id===id):null;
  document.getElementById('modalTitle').textContent=it?'✏️ Modifier':'🎯 Nouvel item';
  document.getElementById('wDeleteBtn').style.display=it?'flex':'none';
  document.getElementById('wName').value=it?.name||'';
  document.getElementById('wJeu').value=it?.jeu||'pokemon';
  document.getElementById('wPri').value=it?.priority||'med';
  document.getElementById('wBudget').value=it?.budget||'';
  document.getElementById('wPrixActuel').value=it?.prixActuel||'';
  document.getElementById('wCmLink').value=it?.cmLink||'';
  document.getElementById('wDate').value=it?.date||'';
  document.getElementById('wImg').value=it?.img||'';
  document.getElementById('wNotes').value=it?.notes||'';
  const prev=document.getElementById('wImgPreview');
  if(it?.img){prev.src=it.img;prev.style.display='block';}else prev.style.display='none';
  document.getElementById('modalWish').classList.add('open');
}
function closeModal(){document.getElementById('modalWish').classList.remove('open');editingId=null;}
function openWCM(){
  const url=document.getElementById('wCmLink').value.trim();
  if(!url){showToast('Colle d\'abord un lien Cardmarket','err');return;}
  window.open(url,'_blank');
}
function previewWImg(){
  const url=document.getElementById('wImg').value.trim();
  const prev=document.getElementById('wImgPreview');
  if(url){prev.src=url;prev.style.display='block';prev.onerror=()=>prev.style.display='none';}
  else prev.style.display='none';
}
function saveItem(){
  const name=document.getElementById('wName').value.trim();
  if(!name){showToast('Le nom est obligatoire','err');return;}
  const data={
    name,jeu:document.getElementById('wJeu').value,
    priority:document.getElementById('wPri').value,
    budget:parseFloat(document.getElementById('wBudget').value)||null,
    prixActuel:parseFloat(document.getElementById('wPrixActuel').value)||null,
    cmLink:document.getElementById('wCmLink').value.trim()||null,
    date:document.getElementById('wDate').value||null,
    img:document.getElementById('wImg').value.trim()||null,
    notes:document.getElementById('wNotes').value.trim()||null,
    updatedAt:Date.now(),
  };
  if(editingId){
    const idx=S.items.findIndex(x=>x.id===editingId);
    if(idx>-1)S.items[idx]={...S.items[idx],...data};
    showToast('Item modifié ✔','ok');
  }else{
    S.items.unshift({id:Date.now().toString(),...data,status:'want',createdAt:Date.now()});
    showToast('Ajouté à la wishlist ✔','ok');
  }
  closeModal();save();render();updateStats();updateCounts();
}
function deleteItem(){
  if(!editingId||!confirm('Supprimer cet item ?'))return;
  S.items=S.items.filter(x=>x.id!==editingId);
  closeModal();save();render();updateStats();updateCounts();showToast('Supprimé','ok');
}
function quickDelete(id){
  if(!confirm('Supprimer ?'))return;
  S.items=S.items.filter(x=>x.id!==id);
  save();render();updateStats();updateCounts();showToast('Supprimé','ok');
}

// ── ACQUÉRIR ──────────────────────────────────────────────────────────────
// Marque comme acquis puis propose de transférer dans Mes Items
function acquireItem(){
  const it=S.items.find(x=>x.id===detailId);
  if(!it)return;
  it.status='acquired';it.acquiredAt=Date.now();
  save();render();updateStats();updateCounts();
  document.getElementById('detailOverlay').classList.remove('open');
  showToast('Marqué comme acquis ✔','ok');

  // Propose le transfert vers items.html via localStorage bridge
  setTimeout(function(){
    if(confirm('Ajouter cet item dans "Mes Items" maintenant ?')){
      transferToItems(it);
    }
  },400);
}

function transferToItems(it){
  try {
    var raw=localStorage.getItem('items_v1_cache');
    var cache=raw?JSON.parse(raw):{items:[]};
    cache.items=cache.items||[];
    // Map wishlist data to items format
    var TYPE_MAP={pokemon:'display',op:'display',lorcana:'display',magic:'display',autre:'autre'};
    cache.items.unshift({
      id:Date.now().toString(),
      name:it.name,
      jeu:it.jeu||'autre',
      type:TYPE_MAP[it.jeu]||'autre',
      etat:'scelle',
      qte:1,
      prixAchat:it.prixActuel||it.budget||null,
      prixMarche:null,
      img:it.img||null,
      cmLink:it.cmLink||null,
      notes:(it.notes?it.notes+'\n':'')+'Transféré depuis la wishlist',
      linked:false,
      createdAt:Date.now(),
      updatedAt:Date.now(),
      priceHistory:[],
    });
    localStorage.setItem('items_v1_cache',JSON.stringify(cache));
    showToast('Transféré dans Mes Items ✔','ok');
    setTimeout(function(){ if(confirm('Ouvrir Mes Items ?')) window.location.href='items.html'; },600);
  } catch(e) { showToast('Erreur de transfert','err'); console.warn(e); }
}

// ── DETAIL ────────────────────────────────────────────────────────────────
function openDetail(id){
  const it=S.items.find(x=>x.id===id);
  if(!it)return;
  detailId=id;
  const acq=it.status==='acquired';
  const TYPE_EMO={pokemon:'⚡',op:'🏴‍☠️',lorcana:'🌟',magic:'🔮',autre:'📦'};
  const te=TYPE_EMO[it.jeu]||'📦';
  document.getElementById('dImgWrap').innerHTML=it.img
    ?`<img class="detail-panel-img" src="${esc(it.img)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=detail-panel-img-ph>${te}</div>'"/>`
    :`<div class="detail-panel-img-ph">${te}</div>`;
  document.getElementById('dName').textContent=it.name;
  document.getElementById('dChips').innerHTML=`
    <span class="chip ${PRI_CHIP[it.priority]||''}">${PRI_LABEL[it.priority]||'—'}</span>
    <span class="chip chip-game-${it.jeu}">${GAME_EMOJI[it.jeu]||''} ${GAME_NAME[it.jeu]||it.jeu}</span>
    ${acq?'<span class="chip chip-acquired">✅ Acquis</span>':''}`;
  const inBudget=it.budget&&it.prixActuel&&parseFloat(it.prixActuel)<=parseFloat(it.budget);
  document.getElementById('dGrid').innerHTML=`
    <div class="detail-field"><div class="detail-field-label">Budget max</div><div class="detail-field-val gold">${it.budget?numFmt(it.budget)+' €':'—'}</div></div>
    <div class="detail-field"><div class="detail-field-label">Prix actuel</div><div class="detail-field-val" style="color:${inBudget?'var(--green)':'var(--snow)'}">${it.prixActuel?numFmt(it.prixActuel)+' €':'—'}</div></div>
    <div class="detail-field"><div class="detail-field-label">Date cible</div><div class="detail-field-val">${it.date||'—'}</div></div>
    <div class="detail-field"><div class="detail-field-label">Jeu</div><div class="detail-field-val">${GAME_EMOJI[it.jeu]||''} ${GAME_NAME[it.jeu]||it.jeu}</div></div>`;
  const notesEl=document.getElementById('dNotes');
  if(it.notes){notesEl.style.display='block';document.getElementById('dNotesText').textContent=it.notes;}
  else notesEl.style.display='none';
  const cmWrap=document.getElementById('dCmWrap');
  if(it.cmLink){cmWrap.style.display='block';document.getElementById('dCmLink').href=it.cmLink;}
  else cmWrap.style.display='none';
  document.getElementById('dAcquireBtn').style.display=acq?'none':'flex';
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(e){if(e.target.id==='detailOverlay')document.getElementById('detailOverlay').classList.remove('open');}
function editFromDetail(){document.getElementById('detailOverlay').classList.remove('open');openModal(detailId);}
function deleteFromDetail(){
  if(!detailId||!confirm('Supprimer ?'))return;
  S.items=S.items.filter(x=>x.id!==detailId);
  document.getElementById('detailOverlay').classList.remove('open');
  save();render();updateStats();updateCounts();showToast('Supprimé','ok');
}

// ── SAVE ──────────────────────────────────────────────────────────────────
function save(){
  try{localStorage.setItem(SK+'_cache',JSON.stringify(S));}catch(e){}
  if(!window._uid)return;
  clearTimeout(window._saveT);
  window._saveT=setTimeout(async()=>{
    try{await window._setDoc(window._doc(window._db,'wishlist_v1',window._uid),{items:S.items});}
    catch(e){console.warn('Firestore save:',e);}
  },900);
}

// ── UTILS ─────────────────────────────────────────────────────────────────
function numFmt(n){return parseFloat(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let _toastT;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast on'+(type?' '+type:'');
  clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('on'),2800);
}

// Raccourcis clavier
document.addEventListener('keydown',function(e){
  const tag=document.activeElement?.tagName;
  const inInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  const modalOpen=document.getElementById('modalWish').classList.contains('open');
  if(e.key==='Escape'&&document.getElementById('detailOverlay').classList.contains('open')){
    document.getElementById('detailOverlay').classList.remove('open');return;
  }
  if(inInput||modalOpen)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();openModal();}
  if(e.key==='g'||e.key==='G')setView('grid');
  if(e.key==='l'||e.key==='L')setView('list');
  if(e.key==='f'||e.key==='F'){e.preventDefault();document.getElementById('searchBox')?.focus();}
});
</script>
</body>
</html>
